name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

env:
  COMPONENT_DIR: open_spot_forecast

permissions:
  contents: read

jobs:
  release_zip_file:
    name: Prepare release asset
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      # The release version only goes into the zip (hacs.json: zip_release). It is not pushed
      # to main, which accepts commits only through a pull request with passing checks.
      - name: Update manifest.json version to ${{ github.event.release.tag_name }}
        run: |
          python3 ${{ github.workspace }}/.github/scripts/update_hacs_manifest.py --version ${{ github.event.release.tag_name }} --path /custom_components/open_spot_forecast/
      - name: Create zip
        run: |
          cd custom_components/open_spot_forecast
          zip open_spot_forecast.zip -r ./
      - name: Upload zip to release
        uses: svenstaro/upload-release-action@2.11.5
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./custom_components/open_spot_forecast/open_spot_forecast.zip
          asset_name: open_spot_forecast.zip
          tag: ${{ github.ref }}
          overwrite: true
