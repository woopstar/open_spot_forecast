name: Code validation

# The HACS action looks the branch up by name through the GitHub API, so the branch has to
# exist while the check runs. Both checks are required on main, which keeps it there.
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  validate-hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
      - name: validation
        uses: home-assistant/actions/hassfest@master

  validate-hacs:
    name: HACS validation
    runs-on: "ubuntu-latest"
    steps:
      - name: checkout
        uses: "actions/checkout@v7.0.1"
      - name: validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          ignore: "brands"
